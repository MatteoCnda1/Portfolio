server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Derrière Caddy : redirections relatives (sinon http:// et port interne).
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Fichiers générés par Astro : noms hachés, cache long.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
